[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "downbeat"
version = "4.0.0"
description = "Real-time GPU studio for beat-locked, audio-reactive Spotify Canvas loops (9:16, 30fps)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Lambda Audio" }
]
keywords = ["spotify", "canvas", "video", "shaders", "audio-reactive", "opencv", "vj"]
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
downbeat = "downbeat.cli:main"

[tool.setuptools]
packages = ["downbeat", "downbeat.effects"]
include-package-data = true

[tool.setuptools.package-data]
downbeat = ["studio/*.html", "studio/*.css", "studio/*.ts", "studio/src/**/*.ts", "studio/src/**/*.tsx", "studio/dist/**/*"]
