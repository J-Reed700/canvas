[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canvasforge"
version = "2.5.0"
description = "Audio-Reactive Spotify Canvas & 2026 Shader Studio (9:16 portrait, 1080x1920 @ 30fps)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Lambda Audio" }
]
keywords = ["spotify", "canvas", "video", "shaders", "audio-reactive", "opencv", "vj"]
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
canvasforge = "canvasforge.cli:main"

[tool.setuptools]
packages = ["canvasforge"]
include-package-data = true

[tool.setuptools.package-data]
canvasforge = ["ui.html"]
