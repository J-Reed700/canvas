[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canvasforge"
version = "4.0.0"
description = "Real-time GPU studio for beat-locked, audio-reactive Spotify Canvas loops (9:16, 30fps)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Lambda Audio" }
]
keywords = ["spotify", "canvas", "video", "shaders", "audio-reactive", "opencv", "vj"]
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
canvasforge = "canvasforge.cli:main"

[tool.setuptools]
packages = ["canvasforge"]
include-package-data = true

[tool.setuptools.package-data]
canvasforge = ["ui.html", "studio/*.html", "studio/*.js"]
