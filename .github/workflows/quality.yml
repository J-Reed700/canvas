name: Studio quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        # Windows has its own file locking, paths, process handling and ANGLE backend, so it runs the same gate.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 20 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install native media tools
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            choco install ffmpeg -y --no-progress
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
      - run: python -m venv .venv
      - run: ${{ runner.os == 'Windows' && '.venv/Scripts/python.exe' || '.venv/bin/python' }} -m pip install -e '.[dev]'
      - run: npm ci
      - name: Types, coverage, build, real browser exports and CPU budgets
        run: npm run quality
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: studio-quality-evidence-${{ runner.os }}
          path: artifacts/
          if-no-files-found: ignore
